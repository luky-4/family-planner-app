<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Family Planner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --ink: #1f2421; --muted: #6b726d; --line: #e4e2db;
  --accent: #2f5d50; --accent-ink: #ffffff; --soft: #e8efe9;
  --ok: #2e7d4f; --ok-soft: #e3f2e8; --warn: #9a6a00; --warn-soft: #fbf1d9; --bad: #b3261e; --bad-soft: #fbe5e3;
  --radius: 12px; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141715; --card: #1d211f; --ink: #e9ece9; --muted: #9aa39d; --line: #2e3430;
    --accent: #7fb8a4; --accent-ink: #0f1311; --soft: #23302b;
    --ok: #7fcf9c; --ok-soft: #1e3326; --warn: #e6c068; --warn-soft: #362d17; --bad: #f08f86; --bad-soft: #3a1f1d;
    --shadow: none; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: env(safe-area-inset-top) 0 0; }
.top { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 4px; max-width: 900px; margin: 0 auto; }
.top h1 { font-size: 18px; margin: 0; }
nav { display: flex; gap: 4px; overflow-x: auto; padding: 6px 16px 10px; max-width: 900px; margin: 0 auto; scrollbar-width: none; }
nav button { border: 0; background: transparent; padding: 7px 12px; border-radius: 999px; color: var(--muted); white-space: nowrap; cursor: pointer; }
nav button.on { background: var(--accent); color: var(--accent-ink); }
main { max-width: 900px; margin: 0 auto; padding: 14px 16px 90px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-bottom: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 160px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
h2 { font-size: 16px; margin: 18px 0 8px; }
h3 { font-size: 15px; margin: 0 0 6px; }
input, select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 38px; }
textarea { min-height: 64px; resize: vertical; }
input[type=checkbox] { width: 18px; min-height: 18px; accent-color: var(--accent); }
label.f { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.grid .wide { grid-column: 1 / -1; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px 12px; cursor: pointer; min-height: 38px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.icon { padding: 6px 10px; }
.chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--ink); margin: 2px 4px 2px 0; }
.chip.approvata { background: var(--ok-soft); color: var(--ok); }
.chip.bozza { background: var(--warn-soft); color: var(--warn); }
.chip.scartata { background: var(--bad-soft); color: var(--bad); }
.ricetta { cursor: pointer; }
.ricetta .nome { font-weight: 600; margin-bottom: 4px; }
.azioni { display: flex; gap: 6px; margin-top: 8px; }
.lista-righe .riga { display: grid; gap: 6px; align-items: center; padding: 6px 0; border-top: 1px dashed var(--line); }
.lista-righe .riga:first-child { border-top: 0; }
.r-ingr { grid-template-columns: 1fr 70px 70px 36px; }
.r-prep { grid-template-columns: 1fr 105px 62px 62px 62px 36px; }
.r-pref { grid-template-columns: 120px 1fr 1fr 36px; }
.r-rout { grid-template-columns: 105px 100px 1fr 90px 90px 28px 36px; }
@media (max-width: 640px) {
  .r-prep { grid-template-columns: 1fr 1fr 1fr; }
  .r-prep .nome-p { grid-column: 1 / -1; }
  .r-pref { grid-template-columns: 1fr 1fr 36px; }
  .r-pref .note-p { grid-column: 1 / 3; }
  .r-rout { grid-template-columns: 1fr 1fr 36px; }
  .r-rout > :nth-child(1) { order: 1; } .r-rout > :nth-child(2) { order: 2; } .r-rout > :last-child { order: 3; }
  .r-rout .desc { grid-column: 1 / -1; order: 4; }
  .r-rout > :nth-child(4) { order: 5; } .r-rout > :nth-child(5) { order: 6; }
  .r-rout .att { order: 7; justify-self: center; }
  .lista-righe .intest { display: none; }
}
.intest { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: flex; justify-content: center; align-items: flex-end; }
.sheet .pannello { background: var(--bg); width: 100%; max-width: 900px; max-height: 94vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 16px 16px calc(80px + env(safe-area-inset-bottom)); }
@media (min-width: 700px) { .sheet { align-items: center; } .sheet .pannello { border-radius: 16px; max-height: 90vh; padding-bottom: 16px; } }
.barra { position: sticky; bottom: -16px; background: var(--bg); padding: 12px 0 4px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--line); margin-top: 16px; }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; max-width: calc(100% - 32px); }
#toast.on { opacity: 1; }
#toast.err { background: var(--bad); color: #fff; }
.vuoto { text-align: center; padding: 40px 16px; color: var(--muted); }
.giorno { font-weight: 600; margin: 16px 0 6px; }
.filtri { display: grid; grid-template-columns: 1fr 140px 160px 140px; gap: 8px; margin-bottom: 12px; }
@media (max-width: 640px) { .filtri { grid-template-columns: 1fr 1fr; } .filtri .cerca { grid-column: 1 / -1; } }
</style>
</head>
<body>
<header>
  <div class="top"><h1>🏡 Family Planner</h1><span id="stato" class="muted small"></span></div>
  <nav id="nav"></nav>
</header>
<main id="app"><div class="vuoto">Caricamento…</div></main>
<div id="toast"></div>

<script>
const API = "https://ytjweidetxjqgcxdazou.supabase.co/functions/v1/dashboard";
const CHIAVE = "fp_sessione";
const SEZIONI = [["ricette", "Ricette"], ["famiglia", "Famiglia"], ["freezer", "Freezer"], ["menu", "Menù"], ["impostazioni", "Impostazioni"]];
const STATI = ["approvata", "bozza", "scartata"];
const CATEGORIE = ["carne_bianca", "carne_rossa", "pesce", "legumi", "uova", "formaggio", "pizza", "vegetale"];
const TIPI = ["piatto_unico", "base", "proteina", "contorno", "zuppa", "dessert"];
const PASTI = ["entrambi", "cena", "pranzo"];
const METODI = ["forno", "fornelli", "griglia", "vapore", "crudo"];
const RUOLI = ["genitore", "figlio", "tata"];
const TIPI_PREF = ["escluso", "non_gradito", "gradito"];
const GIORNI = ["", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato", "Domenica"];

let D = null;          // dati dal server
let sezione = "ricette";
const filtro = { testo: "", stato: "", categoria: "", tipo: "" };
const NOMI_TIPO = { piatto_unico: "piatto unico", base: "primo / base", proteina: "secondo", contorno: "contorno", zuppa: "zuppa", dessert: "dessert" };

// ---------- utilità ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const opzioni = (lista, sel, etichette = {}) => lista.map((v) => `<option value="${esc(v)}" ${v == sel ? "selected" : ""}>${esc(etichette[v] ?? v.replace("_", " "))}</option>`).join("");
// Se il browser blocca localStorage la sessione vive solo finché la pagina resta aperta
const sessione = () => { try { return localStorage.getItem(CHIAVE) || window.__sessione || null; } catch { return window.__sessione || null; } };

function toast(testo, errore = false) {
  const t = $("#toast");
  t.textContent = testo;
  t.className = "on" + (errore ? " err" : "");
  clearTimeout(t._t);
  t._t = setTimeout(() => (t.className = ""), errore ? 4000 : 1600);
}

async function api(azione, corpo = {}) {
  const r = await fetch(API, {
    method: "POST",
    headers: { "content-type": "application/json", ...(sessione() ? { authorization: `Bearer ${sessione()}` } : {}) },
    body: JSON.stringify({ azione, ...corpo }),
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && azione !== "accedi") { mostraLogin(j.errore); throw new Error(j.errore); }
  if (!r.ok) throw new Error(j.errore || `Errore ${r.status}`);
  return j;
}

async function salva(azione, corpo, msg = "Salvato ✓") {
  try {
    const r = await api(azione, corpo);
    toast(msg);
    return r;
  } catch (e) {
    toast(e.message, true);
    throw e;
  }
}

async function ricarica() {
  D = await api("dati");
  render();
}

// ---------- accesso ----------
function mostraLogin(msg) {
  window.__sessione = null;
  try { localStorage.removeItem(CHIAVE); } catch {}
  $("#nav").innerHTML = "";
  $("#app").innerHTML = `<div class="card vuoto">
    <p style="font-size:40px;margin:0">🔐</p>
    <p><strong>${esc(msg || "Accesso richiesto")}</strong></p>
    <p class="muted">Nel gruppo Telegram scrivi <strong>/dashboard</strong> e apri il link che ti manda il bot.</p></div>`;
}

async function avvio() {
  const m = location.hash.match(/t=([0-9a-f]{64})/);
  if (m) {
    history.replaceState(null, "", location.pathname); // il codice sparisce dalla barra degli indirizzi
    try {
      const { sessione: s } = await api("accedi", { otp: m[1] });
      window.__sessione = s;
      try { localStorage.setItem(CHIAVE, s); } catch {}
    } catch (e) {
      // Link già usato o scaduto: se questo dispositivo ha già una sessione valida, si entra comunque
      if (!sessione()) return mostraLogin(e.message);
    }
  }
  if (!sessione()) return mostraLogin();
  try { await ricarica(); } catch (e) { if (sessione()) $("#app").innerHTML = `<div class="card vuoto">${esc(e.message)}</div>`; }
}

// ---------- render ----------
function render() {
  $("#nav").innerHTML = SEZIONI.map(([k, t]) => `<button data-sez="${k}" class="${k === sezione ? "on" : ""}">${t}</button>`).join("");
  ({ ricette: renderRicette, famiglia: renderFamiglia, freezer: renderFreezer, menu: renderMenu, impostazioni: renderImpostazioni })[sezione]();
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-sez]");
  if (b) { sezione = b.dataset.sez; render(); scrollTo(0, 0); }
});

// ---------- ricette ----------
function renderRicette() {
  const t = filtro.testo.toLowerCase();
  const lista = D.ricette.filter((r) =>
    (!filtro.stato || r.stato === filtro.stato) && (!filtro.categoria || r.categoria === filtro.categoria) &&
    (!filtro.tipo || r.tipo === filtro.tipo) &&
    (!t || r.nome.toLowerCase().includes(t) || r.ricetta_ingredienti.some((i) => i.ingrediente.includes(t))));
  const conta = (s) => D.ricette.filter((r) => r.stato === s).length;
  $("#stato").textContent = `${conta("approvata")} approvate · ${conta("bozza")} bozze`;
  $("#app").innerHTML = `
    <div class="filtri">
      <input class="cerca" id="f-testo" placeholder="Cerca nome o ingrediente…" value="${esc(filtro.testo)}">
      <select id="f-stato"><option value="">Tutti gli stati</option>${opzioni(STATI, filtro.stato)}</select>
      <select id="f-cat"><option value="">Tutte le categorie</option>${opzioni(CATEGORIE, filtro.categoria)}</select>
      <select id="f-tipo"><option value="">Tutti i tipi</option>${opzioni(TIPI, filtro.tipo, NOMI_TIPO)}</select>
    </div>
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <span class="muted small">${lista.length} ricette</span>
      <div class="row">
        <button class="btn" id="scarica-xlsx" title="Scarica tutte le ricette in Excel">⬇︎ Excel</button>
        <button class="btn" id="scarica-csv" title="Scarica tutte le ricette in CSV">⬇︎ CSV</button>
        <button class="btn" id="carica" title="Carica un file Excel o CSV modificato">⬆︎ Carica</button>
        <button class="btn primary" id="nuova">+ Nuova ricetta</button>
      </div>
      <input type="file" id="file-ricette" accept=".xlsx,.xls,.csv" hidden>
    </div>
    ${lista.map((r) => `
      <div class="card ricetta" data-id="${r.id}">
        <div class="nome">${esc(r.nome)}</div>
        <span class="chip ${r.stato}">${r.stato}</span><span class="chip">${esc(NOMI_TIPO[r.tipo] ?? r.tipo)}</span><span class="chip">${esc(r.categoria.replace("_", " "))}</span>
        ${r.cottura_lunga ? '<span class="chip">⏱ lunga</span>' : ""}
        ${r.preparabile_giorno_prima ? '<span class="chip">📦 giorno prima</span>' : ""}
        ${r.contorno_da_proporre ? '<span class="chip">🥦 contorno proposto</span>' : ""}
        ${r.max_volte_30gg != null ? `<span class="chip">🔁 max ${r.max_volte_30gg}/30gg</span>` : ""}
        ${(r.preparazioni || []).some((p) => p.metodo === "forno") ? '<span class="chip">🔥 forno</span>' : ""}
        <div class="azioni">
          ${r.stato !== "approvata" ? `<button class="btn icon" data-stato="approvata">✓ Approva</button>` : ""}
          ${r.stato !== "scartata" ? `<button class="btn icon ghost" data-stato="scartata">Scarta</button>` : `<button class="btn icon ghost" data-stato="bozza">Ripristina</button>`}
        </div>
      </div>`).join("") || '<div class="vuoto">Nessuna ricetta con questi filtri.</div>'}`;

  $("#f-testo").oninput = (e) => { filtro.testo = e.target.value; const pos = e.target.selectionStart; renderRicette(); const i = $("#f-testo"); i.focus(); i.setSelectionRange(pos, pos); };
  $("#f-stato").onchange = (e) => { filtro.stato = e.target.value; renderRicette(); };
  $("#f-cat").onchange = (e) => { filtro.categoria = e.target.value; renderRicette(); };
  $("#f-tipo").onchange = (e) => { filtro.tipo = e.target.value; renderRicette(); };
  $("#nuova").onclick = () => apriRicetta(null);
  $("#scarica-xlsx").onclick = () => scaricaRicette("xlsx").catch((e) => toast(e.message, true));
  $("#scarica-csv").onclick = () => scaricaRicette("csv").catch((e) => toast(e.message, true));
  $("#carica").onclick = () => $("#file-ricette").click();
  $("#file-ricette").onchange = (e) => {
    const f = e.target.files[0];
    e.target.value = "";
    if (f) caricaRicette(f).catch((err) => toast(err.message, true));
  };
  for (const c of document.querySelectorAll(".ricetta")) {
    c.onclick = async (e) => {
      const id = Number(c.dataset.id);
      const b = e.target.closest("[data-stato]");
      if (!b) return apriRicetta(D.ricette.find((r) => r.id === id));
      e.stopPropagation();
      await salva("stato_ricetta", { id, stato: b.dataset.stato });
      D.ricette.find((r) => r.id === id).stato = b.dataset.stato;
      renderRicette();
    };
  }
}

function rigaIngr(i = {}) {
  return `<div class="riga r-ingr">
    <input data-k="ingrediente" value="${esc(i.ingrediente)}" placeholder="ingrediente">
    <input data-k="quantita" value="${esc(i.quantita)}" inputmode="decimal" placeholder="q.tà">
    <input data-k="unita" value="${esc(i.unita)}" placeholder="g, pz…" list="unita">
    <button class="btn icon ghost" data-togli title="Togli">✕</button></div>`;
}
function rigaPrep(p = {}) {
  return `<div class="riga r-prep">
    <input class="nome-p" data-k="nome" value="${esc(p.nome)}" placeholder="preparazione (es. lasagne)">
    <select data-k="metodo">${opzioni(METODI, p.metodo || "fornelli")}</select>
    <input data-k="temp" value="${esc(p.temp)}" inputmode="numeric" placeholder="°C">
    <input data-k="minuti" value="${esc(p.minuti)}" inputmode="numeric" placeholder="min">
    <input data-k="anticipabile" value="${esc(p.anticipabile)}" inputmode="numeric" placeholder="+gg" title="Giorni prima in cui si può preparare">
    <button class="btn icon ghost" data-togli title="Togli">✕</button></div>`;
}
const siNo = (k, v, testo) => `<label class="row small"><input type="checkbox" data-f="${k}" ${v ? "checked" : ""}> ${testo}</label>`;

function apriRicetta(r) {
  r = r || { stato: "bozza", categoria: "legumi", tipo: "piatto_unico", pasto: "entrambi", preparazioni: [], ricetta_ingredienti: [], attrezzatura: [], riutilizzabile_in: [], fonte: "Lorenzo" };
  const s = document.createElement("div");
  s.className = "sheet";
  s.innerHTML = `<div class="pannello">
    <h3>${r.id ? `Ricetta #${r.id}` : "Nuova ricetta"}</h3>
    <div class="grid">
      <div class="wide"><label class="f">Nome</label><textarea data-f="nome" rows="2">${esc(r.nome)}</textarea></div>
      <div><label class="f">Stato</label><select data-f="stato">${opzioni(STATI, r.stato)}</select></div>
      <div><label class="f">Categoria (proteina)</label><select data-f="categoria">${opzioni(CATEGORIE, r.categoria)}</select></div>
      <div><label class="f">Tipo</label><select data-f="tipo">${opzioni(TIPI, r.tipo, NOMI_TIPO)}</select></div>
      <div><label class="f">Pasto</label><select data-f="pasto">${opzioni(PASTI, r.pasto)}</select></div>
      <div><label class="f">Minuti preparazione</label><input data-f="minuti_prep" inputmode="numeric" value="${esc(r.minuti_prep)}"></div>
      <div><label class="f">Minuti cottura</label><input data-f="minuti_cottura" inputmode="numeric" value="${esc(r.minuti_cottura)}"></div>
      <div><label class="f">Max volte in 30 giorni</label><input data-f="max_volte_30gg" inputmode="numeric" placeholder="nessun limite" value="${esc(r.max_volte_30gg)}"></div>
      <div><label class="f">Attrezzatura</label><input data-f="attrezzatura" placeholder="forno, fornelli" value="${esc((r.attrezzatura || []).join(", "))}"></div>
      <div class="wide row" style="gap:18px">
        ${siNo("cottura_lunga", r.cottura_lunga, "Cottura lunga (solo smart/weekend)")}
        ${siNo("preparabile_giorno_prima", r.preparabile_giorno_prima, "Si prepara il giorno prima")}
        ${siNo("contorno_da_proporre", r.contorno_da_proporre, "Piatto unico: aggiungi un contorno")}
      </div>
      <div class="wide"><label class="f">Variante Lorenzo (quando c'è pesce)</label><input data-f="variante_lorenzo" value="${esc(r.variante_lorenzo)}"></div>
      <div class="wide"><label class="f">Note famiglia (Leonardo, formaggi…)</label><textarea data-f="note_famiglia">${esc(r.note_famiglia)}</textarea></div>
      <div class="wide"><label class="f">Preparazioni condivisibili con altri pasti (es. riso lessato, sugo di pomodoro): stesse parole = "prepara 2x"</label><input data-f="riutilizzabile_in" value="${esc((r.riutilizzabile_in || []).join(", "))}"></div>
    </div>
    <h2>Ingredienti <span class="muted small">(per tutta la famiglia)</span></h2>
    <div class="card lista-righe" id="ingr">${r.ricetta_ingredienti.map(rigaIngr).join("")}</div>
    <button class="btn" id="add-ingr">+ Ingrediente</button>
    <h2>Preparazioni <span class="muted small">(servono per sfruttare il forno tra un giorno e l'altro)</span></h2>
    <div class="card lista-righe" id="prep">${(r.preparazioni || []).map(rigaPrep).join("")}</div>
    <button class="btn" id="add-prep">+ Preparazione</button>
    <div class="grid" style="margin-top:14px">
      <div><label class="f">Fonte</label><input data-f="fonte" value="${esc(r.fonte)}"></div>
      <div class="wide"><label class="f">Note</label><input data-f="note" value="${esc(r.note)}"></div>
    </div>
    <datalist id="unita"><option>g</option><option>kg</option><option>ml</option><option>l</option><option>pz</option><option>mazzo</option><option>coste</option><option>vasetti</option></datalist>
    <div class="barra"><button class="btn ghost" id="annulla">Annulla</button><button class="btn primary" id="salva">Salva</button></div>
  </div>`;
  document.body.appendChild(s);
  document.body.style.overflow = "hidden";
  const chiudi = () => { s.remove(); document.body.style.overflow = ""; };
  s.onclick = (e) => {
    if (e.target === s) chiudi();
    const t = e.target.closest("[data-togli]");
    if (t) t.parentElement.remove();
  };
  $("#annulla", s).onclick = chiudi;

      variante_lorenzo: f("variante_lorenzo").value.trim(), note_famiglia: f("note_famiglia").value.trim(),

let XLSXlib = null;
async function sheetjs() {
  if (XLSXlib) return XLSXlib;

    const s = document.createElement("script");

    s.onload = ok; s.onerror = () => ko(new Error("Non riesco a caricare il lettore Excel, riprova"));
    document.head.appendChild(s);

}

const numIt = (q) => (q === null || q === undefined || q === "" ? "" : String(q).replace(".", ","));
const testoIngr = (r) => (r.ricetta_ingredienti || []).map((i) => [i.ingrediente, numIt(i.quantita), i.unita || ""].filter(Boolean).join(" ")).join("; ");

  [`${p.nome}: ${p.metodo}`, p.temp ? `${p.temp}°` : "", p.minuti ? `${p.minuti}'` : "", p.anticipabile ? `+${p.anticipabile}g` : ""].filter(Boolean).join(" ")).join("; ");

async function scaricaRicette(formato) {

/**
 * Dà il file all'utente. Sul telefono (e nel browser interno di Telegram) i download "classici" spesso
 * non partono: lì uso il menu Condividi (Salva su File, WhatsApp, Mail…); altrimenti download o anteprima.
 */
async function consegnaFile(blob, nome) {
  const file = new File([blob], nome, { type: blob.type });
  const telefono = /iphone|ipad|android|mobile/i.test(navigator.userAgent);
  if (telefono && navigator.canShare?.({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: nome });
      return toast("File pronto ✓");
    } catch (e) {
      if (e?.name === "AbortError") return; // l'utente ha chiuso il menu
    }
  }
  const url = URL.createObjectURL(blob);
  if (telefono) {
    // Anteprima in una nuova scheda: da lì "Condividi → Salva su File"
    const w = window.open(url, "_blank");
    if (!w) location.href = url;
    toast("Si apre il file: usa Condividi → Salva su File");
  } else {
    const a = document.createElement("a");
    a.href = url;
    a.download = nome;
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast(`Scaricato: ${nome} (cartella Download)`);
  }
  setTimeout(() => URL.revokeObjectURL(url), 60_000);
}

const siNoVal = (v) => /^(s|sì|si|x|true|1|vero)$/i.test(String(v ?? "").trim());
const listaVal = (v) => String(v ?? "").split(",").map((x) => x.trim()).filter(Boolean);
const numVal = (v) => (String(v ?? "").trim() === "" ? null : Number(String(v).replace(",", ".")));

function leggiIngredienti(testo) {
  const t = String(testo ?? "");
  return t.split(t.includes(";") ? ";" : /,(?!\d)/).map((x) => x.trim()).filter(Boolean).map((parte) => {
    const d = parte.match(/^(\d+(?:[.,]\d+)?)\s*(g|gr|kg|ml|cl|l|pz|cucchiai|cucchiaio|cucchiaini|cucchiaino|bustina|bustine|costa|coste|spicchio|spicchi|scatoletta|scatolette|vasetto|vasetti|mazzo|pizzico)?\s+(.+)$/i);
    if (d) return { ingrediente: d[3].trim().toLowerCase(), quantita: Number(d[1].replace(",", ".")), unita: (d[2] || "pz").toLowerCase() };
    const m = parte.match(/^(.+)\s+(\d+(?:[.,]\d+)?)\s*([a-zA-Zàèéìòù]+)?$/);
    return m ? { ingrediente: m[1].trim().toLowerCase(), quantita: Number(m[2].replace(",", ".")), unita: m[3] || null }
      : { ingrediente: parte.toLowerCase(), quantita: null, unita: null };
  });
}
function leggiPreparazioni(testo, avvisi = []) {
  return String(testo ?? "").split(";").map((x) => x.trim()).filter(Boolean).flatMap((parte) => {
    try { return [leggiPreparazione(parte)]; } catch (e) { avvisi.push(e.message + " → ignorata"); return []; }
  });
}
function leggiPreparazione(parte) {
  const i = parte.indexOf(":");
  const nome = (i >= 0 ? parte.slice(0, i) : "").trim().toLowerCase(), resto = i >= 0 ? parte.slice(i + 1) : "";
  const metodo = METODI.find((m) => new RegExp(`\\b${m}\\b`, "i").test(resto));
  if (!nome || !metodo) throw new Error(`preparazione non valida: "${parte}"`);
  const t = resto.match(/(\d+)\s*°/), mi = resto.match(/(\d+)\s*['’]/), an = resto.match(/\+\s*(\d+)\s*g/i);
  return { nome, metodo, ...(t ? { temp: +t[1] } : {}), ...(mi ? { minuti: +mi[1] } : {}), ...(an ? { anticipabile: +an[1] } : {}) };
}
// Sistemazione automatica dei valori scritti a mano nel file
const normTesto = (v) => String(v ?? "").trim().toLowerCase().normalize("NFD").replace(/\p{M}/gu, "").replace(/[\s-]+/g, "_");
function distanza(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
const SINONIMI = {
  stato: { approvato: "approvata", ok: "approvata", si: "approvata", attiva: "approvata", scartato: "scartata", eliminata: "scartata", eliminato: "scartata", no: "scartata", cancellata: "scartata", bozze: "bozza", da_approvare: "bozza", nuova: "bozza" },
  tipo: { primo: "base", primi: "base", pasta: "base", secondo: "proteina", secondi: "proteina", piatto_unico: "piatto_unico", unico: "piatto_unico", contorni: "contorno", verdura: "contorno", minestra: "zuppa", vellutata: "zuppa", dolce: "dessert", frutta: "dessert" },
  categoria: { pollo: "carne_bianca", tacchino: "carne_bianca", coniglio: "carne_bianca", bianca: "carne_bianca", manzo: "carne_rossa", vitello: "carne_rossa", maiale: "carne_rossa", carne: "carne_rossa", rossa: "carne_rossa", salmone: "pesce", tonno: "pesce", merluzzo: "pesce", uovo: "uova", formaggi: "formaggio", latticini: "formaggio", legume: "legumi", ceci: "legumi", lenticchie: "legumi", fagioli: "legumi", verdure: "vegetale", verdura: "vegetale", vegetariano: "vegetale", vegano: "vegetale" },
  pasto: { tutti: "entrambi", tutti_e_due: "entrambi", pranzo_e_cena: "entrambi", sempre: "entrambi", sera: "cena" },
};
/** Riporta un valore scritto a mano a uno di quelli ammessi; null se impossibile */
function correggi(valore, ammessi, campo) {
  const n = normTesto(valore);
  if (ammessi.includes(n)) return n;
  if (SINONIMI[campo]?.[n]) return SINONIMI[campo][n];
  const vicino = ammessi.map((a) => [a, distanza(n, a)]).sort((x, y) => x[1] - y[1])[0];
  if (vicino && vicino[1] <= Math.max(1, Math.floor(vicino[0].length / 4))) return vicino[0];
  const prefisso = ammessi.filter((a) => n.length >= 3 && a.startsWith(n));
  return prefisso.length === 1 ? prefisso[0] : null;
}
/** "30", "30 min", "1 ora", "1h30", "1,5 ore" → minuti */
function minutiVal(v) {
  const t = String(v ?? "").trim().toLowerCase().replace(",", ".");
  if (!t) return null;
  const h = t.match(/^(\d+(?:\.\d+)?)\s*(h|ora|ore)\s*(\d+)?/);
  if (h) return Math.round(Number(h[1]) * 60 + Number(h[3] || 0));
  const m = t.match(/\d+(?:\.\d+)?/);
  return m ? Math.round(Number(m[0])) : NaN;
}
const firmaIngr = (lista) => lista.map((i) => `${i.ingrediente}|${i.quantita ?? ""}|${i.unita ?? ""}`).sort().join(";");

async function caricaRicette(file) {
  const X = await sheetjs();
  let wb;
  if (/\.csv$/i.test(file.name)) {
    const testo = (await file.text()).replace(/^\uFEFF/, "");
    wb = X.read(testo, { type: "string", FS: testo.split("\n")[0].includes(";") ? ";" : "," });
  } else {
    wb = X.read(await file.arrayBuffer(), { type: "array" });
  }
  const ws = wb.Sheets["Ricette"] || wb.Sheets[wb.SheetNames[0]];
  const righe = X.utils.sheet_to_json(ws, { defval: "", raw: false });
  if (!righe.length) throw new Error("Il file non contiene ricette");
  const mancanti = ["nome", "stato", "categoria", "tipo", "ingredienti"].filter((c) => !(c in righe[0]));
  if (mancanti.length) throw new Error(`Colonne mancanti: ${mancanti.join(", ")}`);

  const attuali = new Map(D.ricette.map((r) => [r.id, r]));
  const perNome = new Map(D.ricette.map((r) => [normTesto(r.nome), r]));
  const nuove = [], modificate = [], errori = [], sistemati = [];
  const visti = new Set(); // id e nomi già incontrati nel file

  righe.forEach((v, i) => {
    const n = i + 2;
    const nome = String(v.nome ?? "").replace(/\s+/g, " ").trim();
    if (!nome) return;
    const etichetta = `riga ${n} (${nome.slice(0, 40)})`;
    const fix = (m) => sistemati.push(`${etichetta}: ${m}`);
    const err = (m) => errori.push(`${etichetta}: ${m}`);

    // --- id: sbagliato, inventato o mancante → lo ricavo dal nome quando possibile
    let id = String(v.id ?? "").trim() ? Number(String(v.id).replace(/\D/g, "")) : null;
    const omonima = perNome.get(normTesto(nome));
    let notaId = null;
    if (id !== null && !attuali.has(id)) {
      if (omonima) { notaId = `id ${v.id} non esiste: è la ricetta #${omonima.id} con lo stesso nome`; id = omonima.id; }
      else { notaId = `id ${v.id} non esiste: la carico come ricetta nuova`; id = null; }
    } else if (id === null && omonima) {
      notaId = `esiste già una ricetta con questo nome (#${omonima.id}): la aggiorno invece di duplicarla`; id = omonima.id;
    }
    const chiave = id ?? normTesto(nome);
    if (visti.has(chiave)) { fix(`stessa ricetta già presente più sopra nel file${id ? ` (#${id})` : ""} → ignorata`); return; }
    visti.add(chiave);
    if (notaId) fix(notaId);

    // --- valori a scelta: correggo maiuscole, accenti, refusi e sinonimi
    const scelta = (campo, ammessi, predefinito) => {
      const grezzo = String(v[campo] ?? "").trim();
      if (!grezzo) { if (predefinito) { if (campo !== "pasto" || v[campo] !== undefined) fix(`${campo} vuoto → ${predefinito}`); return predefinito; } return null; }
      const c = correggi(grezzo, ammessi, campo);
      if (c && c !== grezzo) fix(`${campo} "${grezzo}" → ${c}`);
      return c;
    };
    const tipo = scelta("tipo", TIPI, "piatto_unico");
    let categoria = scelta("categoria", CATEGORIE, null);
    if (!categoria && !String(v.categoria ?? "").trim() && tipo === "contorno") { categoria = "vegetale"; fix("categoria vuota → vegetale (contorno)"); }
    const stato = scelta("stato", STATI, "bozza");
    const pasto = scelta("pasto", PASTI, "entrambi");
    if (!tipo) err(`tipo "${v.tipo}" non riconosciuto (ammessi: ${TIPI.join(", ")})`);
    if (!categoria) err(`categoria "${v.categoria}" non riconosciuta (ammesse: ${CATEGORIE.join(", ")})`);
    if (!stato) err(`stato "${v.stato}" non riconosciuto (ammessi: ${STATI.join(", ")})`);
    if (!pasto) err(`pasto "${v.pasto}" non riconosciuto (ammessi: ${PASTI.join(", ")})`);

    // --- numeri: "30 min", "1 ora", "1h30"…
    const numero = (campo, conv = minutiVal) => {
      const grezzo = String(v[campo] ?? "").trim();
      const x = conv(grezzo);
      if (Number.isNaN(x)) { err(`${campo} "${grezzo}" non è un numero`); return null; }
      if (x !== null && String(x) !== grezzo) fix(`${campo} "${grezzo}" → ${x}`);
      return x;
    };
    const avvisiPrep = [];
    const ricetta = {
      ...(id ? { id } : {}),
      nome, stato, categoria, tipo, pasto,
      minuti_prep: numero("minuti_prep"), minuti_cottura: numero("minuti_cottura"),
      max_volte_30gg: numero("max_volte_30gg", (g) => (g === "" ? null : /^\d+/.test(g) ? parseInt(g, 10) : NaN)),
      cottura_lunga: siNoVal(v.cottura_lunga), preparabile_giorno_prima: siNoVal(v.giorno_prima), contorno_da_proporre: siNoVal(v.contorno_da_proporre),
      attrezzatura: listaVal(v.attrezzatura), riutilizzabile_in: listaVal(v.riutilizzabile_in).map((x) => x.toLowerCase()),
      variante_lorenzo: String(v.variante_lorenzo || "").trim() || null, note_famiglia: String(v.note_famiglia || "").trim() || null,
      note: String(v.note || "").trim() || null, fonte: String(v.fonte || "").trim() || "Lorenzo",
      preparazioni: leggiPreparazioni(v.preparazioni, avvisiPrep),
    };
    avvisiPrep.forEach(fix);
    const ingredienti = leggiIngredienti(v.ingredienti);
    if (!String(v.ingredienti ?? "").includes(";") && ingredienti.length > 1) fix("ingredienti separati da virgole → divisi lo stesso");
    if (errori.some((e) => e.startsWith(etichetta))) return;

    if (!id) return nuove.push({ ricetta, ingredienti });
    const vecchia = attuali.get(id), vr = rigaFile(vecchia), cambi = [];
    const conf = (k, a, b) => { if (String(a ?? "") !== String(b ?? "")) cambi.push(k); };
    for (const k of ["nome", "stato", "categoria", "tipo", "pasto", "note", "fonte"]) conf(k, ricetta[k], vecchia[k]);
    for (const k of ["minuti_prep", "minuti_cottura", "max_volte_30gg"]) conf(k, ricetta[k], vecchia[k]);
    conf("variante_lorenzo", ricetta.variante_lorenzo, vecchia.variante_lorenzo);
    conf("note_famiglia", ricetta.note_famiglia, vecchia.note_famiglia);
    conf("cottura_lunga", ricetta.cottura_lunga, vecchia.cottura_lunga);
    conf("giorno_prima", ricetta.preparabile_giorno_prima, vecchia.preparabile_giorno_prima);
    conf("contorno_da_proporre", ricetta.contorno_da_proporre, vecchia.contorno_da_proporre);
    conf("attrezzatura", ricetta.attrezzatura.join(", "), vr.attrezzatura);
    conf("riutilizzabile_in", ricetta.riutilizzabile_in.join(", "), vr.riutilizzabile_in);
    conf("preparazioni", testoPrep(ricetta.preparazioni), vr.preparazioni);
    conf("ingredienti", firmaIngr(ingredienti), firmaIngr(vecchia.ricetta_ingredienti || []));
    if (cambi.length) modificate.push({ ricetta, ingredienti, cambi });
  });
  anteprimaImport(file.name, nuove, modificate, errori, sistemati);
}

function anteprimaImport(nomeFile, nuove, modificate, errori, sistemati = []) {
  const s = document.createElement("div");
  s.className = "sheet";
  const totale = nuove.length + modificate.length;
  s.innerHTML = `<div class="pannello">
    <h3>Carica ${esc(nomeFile)}</h3>
    ${errori.length ? `<div class="card" style="border-color:var(--bad)"><strong style="color:var(--bad)">❌ ${errori.length} righe con errori (non verranno caricate)</strong>
      <div class="small" style="margin-top:6px">${errori.map(esc).join("<br>")}</div></div>` : ""}
    ${sistemati.length ? `<details class="card"><summary><strong>🔧 ${sistemati.length} cose sistemate automaticamente</strong> <span class="muted small">(tocca per vederle)</span></summary>
      <div class="small" style="margin-top:6px">${sistemati.map(esc).join("<br>")}</div></details>` : ""}
    ${totale ? `<div class="card">
      ${nuove.length ? `<strong>➕ ${nuove.length} nuove</strong><div class="small" style="margin:4px 0 10px">${nuove.map((x) => esc(x.ricetta.nome)).join("<br>")}</div>` : ""}
      ${modificate.length ? `<strong>✏️ ${modificate.length} modificate</strong><div class="small" style="margin-top:4px">${modificate.map((x) => `#${x.ricetta.id} ${esc(x.ricetta.nome)} <span class="muted">→ ${x.cambi.join(", ")}</span>`).join("<br>")}</div>` : ""}
    </div>` : `<div class="vuoto">Nessuna differenza rispetto alle ricette attuali ✨</div>`}
    <div class="barra"><button class="btn ghost" id="annulla">${totale ? "Annulla" : "Chiudi"}</button>
      ${totale ? `<button class="btn primary" id="conferma">Carica ${totale} ricette</button>` : ""}</div>
  </div>`;
  document.body.appendChild(s);
  document.body.style.overflow = "hidden";
  const chiudi = () => { s.remove(); document.body.style.overflow = ""; };
  $("#annulla", s).onclick = chiudi;
  s.onclick = (e) => { if (e.target === s) chiudi(); };
  if (!totale) return;
  $("#conferma", s).onclick = async (e) => {
    e.target.disabled = true;
    e.target.textContent = "Carico…";
    try {
      const { esiti } = await api("importa_ricette", { ricette: [...nuove, ...modificate].map(({ ricetta, ingredienti }) => ({ ricetta, ingredienti })) });
      const falliti = esiti.filter((x) => x.errore);
      chiudi();
      await ricarica();
      if (falliti.length) toast(`Caricate ${esiti.length - falliti.length}, errori: ${falliti.map((x) => `${x.nome}: ${x.errore}`).join("; ")}`, true);
      else toast(`✅ ${esiti.length} ricette caricate`);
    } catch (err) {
      toast(err.message, true);
      e.target.disabled = false;
      e.target.textContent = `Carica ${totale} ricette`;
    }
  };
}

    <div class="card lista-righe" id="pref">

    <button class="btn" id="add-pref">+ Preferenza</button>

      <div class="riga r-rout intest"><span>Giorno</span><span>Chi / tipo</span><span class="desc">Descrizione</span><span>Inizio</span><span>Fine</span><span title="Attiva">✓</span><span></span></div>

  for (const c of document.querySelectorAll("[data-membro]")) {

      const v = (k) => $(`[data-k="${k}"]`, c);

        data_nascita: v("data_nascita").value || null, conta_ai_pasti: v("conta_ai_pasti").checked, cucina_la_sera: v("cucina_la_sera").checked } });
    });
  }
  collegaRighe("#pref", "salva_preferenza", "elimina_preferenza", "preferenza", (riga) => ({
    membro_id: Number($('[data-k="membro_id"]', riga).value) || null, tipo: $('[data-k="tipo"]', riga).value,
    oggetto: $('[data-k="oggetto"]', riga).value.trim(), note: $('[data-k="note"]', riga).value.trim(),
  }), (x) => x.oggetto);
  collegaRighe("#rout", "salva_routine", "elimina_routine", "routine", (riga) => ({
    giorno_settimana: Number($('[data-k="giorno_settimana"]', riga).value), membro_id: Number($('[data-k="membro_id"]', riga).value),
    tipo: $('[data-k="tipo"]', riga).value, descrizione: $('[data-k="descrizione"]', riga).value.trim(),
    orario: $('[data-k="orario"]', riga).value || null, uscita: $('[data-k="uscita"]', riga).value || null,
    attiva: $('[data-k="attiva"]', riga).checked,
  }), (x) => x.descrizione);
  $("#add-pref").onclick = () => $("#pref").insertAdjacentHTML("beforeend", rigaPref({ tipo: "escluso" }));
  $("#add-rout").onclick = () => $("#rout").insertAdjacentHTML("beforeend", rigaRout({ giorno_settimana: 1, tipo: "attivita", attiva: true, membro_id: D.membri.find((m) => m.ruolo === "figlio")?.id }));
}

const sceltaMembro = (sel, conTutti) =>
  `<select data-k="membro_id">${conTutti ? `<option value="">Tutta la famiglia</option>` : ""}${D.membri.map((m) => `<option value="${m.id}" ${m.id === sel ? "selected" : ""}>${esc(m.nome)}</option>`).join("")}</select>`;

function rigaPref(p) {
  return `<div class="riga r-pref" data-id="${p.id ?? ""}">
    <div>${sceltaMembro(p.membro_id, true)}<select data-k="tipo" style="margin-top:4px">${opzioni(TIPI_PREF, p.tipo, { non_gradito: "non gradito" })}</select></div>
    <input data-k="oggetto" value="${esc(p.oggetto)}" placeholder="es. pesce">
    <input class="note-p" data-k="note" value="${esc(p.note)}" placeholder="note">
    <button class="btn icon ghost" data-elimina title="Elimina">✕</button></div>`;
}
function rigaRout(r) {
  return `<div class="riga r-rout" data-id="${r.id ?? ""}">
    <select data-k="giorno_settimana">${GIORNI.slice(1).map((g, i) => `<option value="${i + 1}" ${i + 1 === r.giorno_settimana ? "selected" : ""}>${g}</option>`).join("")}</select>
    <div>${sceltaMembro(r.membro_id, false)}<select data-k="tipo" style="margin-top:4px">${opzioni(["attivita", "portare"], r.tipo, { attivita: "attività", portare: "da portare" })}</select></div>
    <input class="desc" data-k="descrizione" value="${esc(r.descrizione)}" placeholder="es. Musica / Merenda">
    <input type="time" data-k="orario" value="${esc(r.orario?.slice(0, 5))}" title="Inizio">
    <input type="time" data-k="uscita" value="${esc(r.uscita?.slice(0, 5))}" title="Fine">
    <input class="att" type="checkbox" data-k="attiva" ${r.attiva !== false ? "checked" : ""} title="Attiva">
    <button class="btn icon ghost" data-elimina title="Elimina">✕</button></div>`;
}

/** Righe con salvataggio automatico al cambio e cancellazione. */
function collegaRighe(sel, azSalva, azElimina, chiave, leggi, completa) {
  const box = $(sel);
  box.addEventListener("change", async (e) => {
    const riga = e.target.closest(".riga[data-id]");
    if (!riga) return;
    const valori = leggi(riga);
    if (!completa(valori)) return; // riga nuova non ancora compilata
    const id = riga.dataset.id ? Number(riga.dataset.id) : undefined;
    const r = await salva(azSalva, { [chiave]: { id, ...valori } });
    riga.dataset.id = r.id;
    D = await api("dati");
  });
  box.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-elimina]");
    if (!b) return;
    const riga = b.closest(".riga");
    if (riga.dataset.id && !confirm("Eliminare questa riga?")) return;
    if (riga.dataset.id) await salva(azElimina, { id: Number(riga.dataset.id) }, "Eliminato");
    riga.remove();
    D = await api("dati");
  });
}

// ---------- freezer ----------
function renderFreezer() {
  $("#stato").textContent = `${D.freezer.length} voci`;
  const settimane = (d) => Math.floor((new Date(D.oggi) - new Date(d)) / (7 * 86400000));
  const data = (d) => new Date(d + "T12:00:00").toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "numeric" });
  $("#app").innerHTML = `
    <div class="card"><div class="row">
      <input class="grow" id="fz-cosa" placeholder="Cosa (es. cotolette)">
      <input id="fz-qta" placeholder="Quantità" style="flex:0 0 110px">
      <button class="btn primary" id="fz-add">Aggiungi</button>
    </div></div>
    ${D.freezer.map((v) => `
      <div class="card row" style="justify-content:space-between">
        <div class="grow"><strong>❄️ ${esc(v.ingrediente)}</strong>${v.quantita ? ` <span class="muted">· ${esc(v.quantita)}</span>` : ""}
          <div class="small muted">${settimane(v.aggiunto_il) >= 1 ? `in freezer da ${settimane(v.aggiunto_il)} sett.` : "aggiunto di recente"}${v.usato_il ? ` · nel menù di ${data(v.usato_il)}` : ""}</div></div>
        <button class="btn icon ghost" data-fz="${v.id}">Tolto</button>
      </div>`).join("") || '<div class="vuoto">Freezer vuoto.</div>'}
    <p class="muted small">Il planner usa per prime le cose in freezer da più tempo e ti ricorda di scongelarle il giorno prima.</p>`;
  $("#fz-add").onclick = async () => {
    const ingrediente = $("#fz-cosa").value.trim();
    if (!ingrediente) return $("#fz-cosa").focus();
    await salva("aggiungi_freezer", { ingrediente, quantita: $("#fz-qta").value.trim() }, "Aggiunto ❄️");
    await ricarica();
  };
  $("#fz-cosa").onkeydown = (e) => e.key === "Enter" && $("#fz-add").click();
  for (const b of document.querySelectorAll("[data-fz]")) {
    b.onclick = async () => { await salva("elimina_freezer", { id: Number(b.dataset.fz) }, "Tolto"); await ricarica(); };
  }
}

// ---------- menù ----------
function renderMenu() {
  $("#stato").textContent = "";
  if (!D.menu.length) { $("#app").innerHTML = '<div class="vuoto">Nessun menù pianificato.<br>Su Telegram: /pianifica</div>'; return; }
  const pasti = new Map();
  for (const m of D.menu) { const k = `${m.data}|${m.pasto}`; pasti.set(k, [...(pasti.get(k) || []), m]); }
  let giorno = "";
  $("#app").innerHTML = [...pasti].map(([k, comp]) => {
    const [data, pasto] = k.split("|");
    const testa = data !== giorno ? `<div class="giorno">${new Date(data + "T12:00:00").toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" })}</div>` : "";
    giorno = data;
    const contorno = comp.find((m) => m.contorno)?.contorno;
    const note = comp.find((m) => m.note_prep)?.note_prep;
    return `${testa}<div class="card">
      <div class="small muted">${pasto === "pranzo" ? "Pranzo" : "Cena"}</div>
      ${comp.map((m) => `<div class="nome ricetta" data-id="${m.ricette?.id}">${esc(m.ricette?.nome)} <span class="chip">${esc(NOMI_TIPO[m.ruolo] ?? m.ricette?.categoria ?? "")}</span></div>`).join("")}
      ${contorno ? `<div class="small">🥦 ${esc(contorno)}</div>` : ""}
      ${note ? `<div class="small muted" style="margin-top:4px">👉 ${esc(note).replaceAll(" · ", "<br>👉 ")}</div>` : ""}
    </div>`;
  }).join("");
  for (const c of document.querySelectorAll(".ricetta[data-id]")) c.onclick = () => apriRicetta(D.ricette.find((r) => r.id === Number(c.dataset.id)));
}
